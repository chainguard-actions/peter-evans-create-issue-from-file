name: Create Issue From File Example Command
on:
  repository_dispatch:
    types: [ciff-example-command]

permissions:
  issues: write
  contents: read

jobs:
  createIssueFromFile:
    runs-on: ubuntu-latest
    steps:
      # Get the target repository and branch
      - name: Get the target repository and branch
        id: vars
        env:
          PAYLOAD_REPOSITORY: ${{ github.event.client_payload.slash_command.repository }}
          DEFAULT_REPOSITORY: ${{ github.repository }}
          PAYLOAD_BRANCH: ${{ github.event.client_payload.slash_command.branch }}
        run: |
          repository=$(printf '%s' "$PAYLOAD_REPOSITORY" | tr -d '\n\r')
          if [[ -z "$repository" ]]; then repository=$(printf '%s' "$DEFAULT_REPOSITORY" | tr -d '\n\r'); fi
          echo "repository=$repository" >> $GITHUB_OUTPUT
          branch=$(printf '%s' "$PAYLOAD_BRANCH" | tr -d '\n\r')
          if [[ -z "$branch" ]]; then branch="main"; fi
          echo "branch=$branch" >> $GITHUB_OUTPUT

      # Checkout the branch to test
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ${{ steps.vars.outputs.repository }}
          ref: ${{ steps.vars.outputs.branch }}

      # Test create
      - name: Create Issue From File
        id: ciff
        uses: ./
        with:
          title: An example issue
          content-filepath: ./example-content/output.md
          labels: |
            report
            automated issue
          assignees: retepsnave

      # Test update
      - name: Create Issue From File
        uses: ./
        with:
          issue-number: ${{ steps.ciff.outputs.issue-number }}
          title: An example issue
          content-filepath: ./example-content/output.md
          labels: |
            report
            automated issue
          assignees: retepsnave

      - name: Add reaction
        uses: peter-evans/create-or-update-comment@71345be0265236311c031f5c7866368bd1eff043 # v4
        with:
          repository: ${{ github.event.client_payload.github.payload.repository.full_name }}
          comment-id: ${{ github.event.client_payload.github.payload.comment.id }}
          reaction-type: hooray
