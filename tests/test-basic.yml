name: Test basic usage - title only
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          token: fake-token-for-testing
          repository: example-owner/example-repo
          title: Test Issue Title
      - name: Assert action ran (output or error expected)
        run: |
          echo "action outcome: ${{ steps.action.outcome }}"
          echo "issue-number output: ${{ steps.action.outputs.issue-number }}"
          # The action will fail due to invalid token, but it should have been invoked
          # We just verify the step ran (outcome is set)
          if [ -z "${{ steps.action.outcome }}" ]; then
            echo "FAIL: action step did not produce an outcome"
            exit 1
          fi
          echo "PASS: action was invoked"
